/* v0.11 — upbeat arcade kitchen HUD; original art, no borrowed game assets. */
:root{
 --cream:#fff3d4;--paper:#fff9e9;--butter:#ffd25d;--brown:#253e4b;
 --muted:#55717b;--border:#e1ad64;--peach:#ff9d7a;--mint:#69c5a5;
 --green:#217c6d;--shadow:0 5px 0 #19445b,0 11px 25px #092d3b43;
 --round:20px;
 --oc-blue:#285b77;--oc-blue-dark:#173c56;--oc-turq:#49a5ae;
 --oc-yellow:#ffd14f;--oc-orange:#ff9d43;--oc-coral:#ef735d;
 --oc-ivory:#fff8e3;--oc-ink:#284051;
}
html{scroll-behavior:auto}
body{
 color:var(--oc-ink);
 background-color:#3d8b97;
 background-image:
  radial-gradient(circle at 14% 14%,#ffffff14 0 2px,transparent 3px),
  repeating-linear-gradient(0deg,transparent 0 48px,#1b617520 49px 51px,transparent 52px 100px),
  repeating-linear-gradient(90deg,transparent 0 48px,#1b617526 49px 51px,transparent 52px 100px),
  linear-gradient(135deg,#3a8293,#65b4b5 55%,#33818f);
 background-size:80px 80px,100px 100px,100px 100px,cover;
 font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
}
button{transition:background-color .14s,box-shadow .14s,transform .14s,border-color .14s}
button:focus-visible{outline:3px solid #fff0ae;outline-offset:3px}
#root{max-width:1440px}
.site-head{
 background:linear-gradient(180deg,#276980 0%,#1f506b 100%);
 color:#fff9e2;padding:8px 12px!important;border:3px solid #19465e;
 border-bottom:5px solid #10394e;border-radius:17px;
 box-shadow:0 5px 0 #14415766,0 9px 18px #0b374332;
 margin-bottom:9px!important;
}
.brand{gap:9px}
.brand-mark{
 border:3px solid #fff1ae;background:linear-gradient(145deg,#ffcf52,#f48642);
 box-shadow:0 4px 0 #b96233,inset 0 2px 0 #fff3bb;
 border-radius:13px;transform:rotate(-5deg);
}
.brand-small{color:#b1e5e4;font-size:10px;letter-spacing:1.5px}
.brand-name{color:#fffdf0;text-shadow:0 2px 0 #123a50,1px 3px 0 #0d384a;font-weight:1000;letter-spacing:.3px}
.meta{gap:6px}
.pill{
 background:#fff2d2;color:#244b62;border:2px solid #ffc35b;
 border-bottom:4px solid #dc8c42;border-radius:12px;padding:5px 10px;
 box-shadow:inset 0 2px #ffffff9e;white-space:nowrap;
}
.pill b{color:#163e54}
.pill.no-time{background:#e0fbdb;color:#266d56;border-color:#86cb84;border-bottom-color:#4c9d78}
.navline{gap:7px}
.nav{
 color:#fffaf2;background:linear-gradient(180deg,#387f94,#265d79);
 border:2px solid #173c58;border-bottom:5px solid #133c54;
 border-radius:13px;box-shadow:inset 0 2px 0 #ffffff22;
 font-weight:1000;text-shadow:0 1px 0 #173e58;letter-spacing:.1px;
}
.nav:hover:not(.active){background:linear-gradient(180deg,#509bab,#31768a)}
.nav.active{
 background:linear-gradient(180deg,#ffe078,#ffb947);
 border-color:#a85c2d;border-bottom-color:#95502d;
 color:#5b3e2e;text-shadow:0 1px 0 #fff0bb;
 box-shadow:inset 0 2px 0 #fff3b6;
}
.nav:active,.btn:active:not(:disabled),.tab:active,.cafe-kind:active{transform:translateY(2px);border-bottom-width:2px;box-shadow:none}
.card,.play-pantry,.order-console,.plate-console,.grill-console{
 box-shadow:0 5px 0 #0e52677a,0 10px 20px #143a4b26;
}
.card{
 background:#fff9e7;border:3px solid #e5b869;border-bottom-width:6px;
 border-radius:20px;color:var(--oc-ink);
}
.eyebrow{color:#2a7890;letter-spacing:1.2px}
.tiny,.subtitle{color:#687d7f}
.btn{
 color:#28465a;border:2px solid #c7a26f;border-bottom:4px solid #ad8050;
 background:linear-gradient(180deg,#fffdf2,#f4e3c2);
 border-radius:11px;box-shadow:inset 0 2px 0 #fff;
 font-weight:1000;
}
.btn.primary{
 background:linear-gradient(180deg,#ffdc76,#ffae48);
 color:#653a1f;border-color:#bd762f;border-bottom-color:#98592c;
 box-shadow:inset 0 2px 0 #fff3ae;
}
.btn.green{
 background:linear-gradient(180deg,#ffd768,#ffa12f);
 color:#59351f;border-color:#be6730;border-bottom:5px solid #9d552c;
 box-shadow:inset 0 2px 0 #ffef9e,0 4px 0 #8e5331;
 text-shadow:0 1px 0 #ffe4a5;
}
.btn.green:hover:not(:disabled){filter:brightness(1.04)}
.btn.secondary{background:linear-gradient(180deg,#f2faff,#cce5eb);border-color:#87b2bc;border-bottom-color:#5d98a9;color:#265f70}
.btn:disabled{opacity:.45;filter:saturate(.7)}
.mode-banner,.order-note{background:#dff7e2;color:#236d5e}
/* Hanging order tickets: crisp readable info, no hurry bar. */
.order-console{
 position:relative;background:#fff9e3;
 border:3px solid #d79e4c;border-bottom:6px solid #ad6b40;
 border-radius:15px;color:#263f50;
 background-image:linear-gradient(90deg,#f7e4bb 0 6px,transparent 6px),linear-gradient(180deg,#fffdf1,#fff4d7);
}
.order-console::before{
 content:"📋  ORDER TICKET";display:inline-block;
 padding:2px 9px;margin:-2px 0 7px;
 background:#286b86;color:#fff7da;font-size:10px;font-weight:1000;
 border-radius:5px;letter-spacing:1px;border-bottom:3px solid #17455b;
}
.order-person{background:linear-gradient(160deg,#ffdc76,#f4aa4e);border:2px solid #db8b39;box-shadow:0 2px 0 #b67439}
.order-serial{color:#658392;font-weight:900}
.order-recipe,.cafe-order-name{color:#1a4257;font-weight:1000}
.small-action,.receipt-book{
 background:#fff7e3;border:2px solid #e2b565;border-bottom:3px solid #ba864a;
 color:#245673;box-shadow:inset 0 1px 0 white;
}
.order-receipt,.cafe-recipe-detail{background:#fff8df;border-color:#dfb270}
.receipt-mod.receipt-add{color:#216b5b}.receipt-mod.receipt-remove{color:#c85c46}
.receipt-sign{background:#c7eed6}.receipt-remove .receipt-sign{background:#ffe1ce}
.cafe-mod{
 background:#d7f4df;color:#206c56;border:1.5px solid #72bb8b;
 border-bottom:3px solid #56a87c;border-radius:8px;
}
.cafe-mod.remove{background:#ffe0d4;border-color:#e99a78;color:#b34933;border-bottom-color:#d7785b}
.cafe-mod.none{background:#fff0ca;color:#85551c;border-color:#e4c278}
.cafe-recipe-row{color:#426f70}
/* Bright diner signage for the four cooking counters. */
.cafe-kind-tabs{gap:8px}
.cafe-kind{
 background:linear-gradient(180deg,#fffaf0,#f3ddae);
 border:2px solid #a96632;border-bottom:5px solid #925029;
 border-radius:12px;color:#68432c;font-weight:1000;
 box-shadow:inset 0 2px 0 #fff8e3;
}
.cafe-kind:nth-child(2){background:linear-gradient(180deg,#ffdbcd,#f9aa88);border-color:#b36c4e;border-bottom-color:#994f3d}
.cafe-kind:nth-child(3){background:linear-gradient(180deg,#dcf6e7,#87d8c2);border-color:#4c957a;border-bottom-color:#31765f}
.cafe-kind:nth-child(4){background:linear-gradient(180deg,#ffeeb9,#ffd368);border-color:#b4883c;border-bottom-color:#996a31}
.cafe-kind.active,.cafe-kind:nth-child(n).active{
 background:linear-gradient(180deg,#fff1a2,#ffb638);border:3px solid #fff5d4;
 border-bottom:5px solid #ca7132;color:#5c361d;
 box-shadow:0 0 0 2px #155c75,inset 0 2px 0 #fffbd7;
 text-shadow:0 1px 0 #fff6cb;
}
/* Food preparation surfaces: wood counters, enamel trays, brushed steel grill. */
.plate-console{
 background:repeating-linear-gradient(0deg,#e8b57c 0 32px,#dda267 33px 35px,#e8b57c 36px 64px);
 border:3px solid #a8643a;border-bottom:7px solid #864d35;
 border-radius:16px;padding:9px;color:#503a2e;
}
.plate-console .station-heading{color:#fffdf0;text-shadow:0 2px 1px #683c25;background:#bb7648;border:2px solid #8e5235;border-radius:8px;padding:4px 7px}
.station-indicator{color:#fff4d1}
.plate-console .plate,.cafe-art{
 background:
  radial-gradient(ellipse at 50% 55%,#fff9e6 0 38%,#c5dfdf 39% 43%,#f5f7ea 44% 49%,transparent 50%),
  repeating-linear-gradient(90deg,#d8e9e9 0 36px,#d1e2e1 36px 38px);
 border:3px solid #b4d1d1;border-bottom:5px solid #7fa5a9;
 border-radius:14px;
 box-shadow:inset 0 3px 10px #5b9aa225,0 2px 3px #85522c33;
}
.plate-console .plate.empty:after{color:#617879;text-shadow:0 1px 1px white}
.grill-console{
 background:linear-gradient(140deg,#dae9e9,#94b4bb 55%,#d2dfd9);
 border:3px solid #56808a;border-bottom:7px solid #2c5866;
 border-radius:16px;padding:9px;
}
.grill-console .station-heading{color:#214d5b;text-shadow:0 1px 0 #fff;border-bottom:2px solid #7fa0aa;padding:2px 2px 5px}
.grill-console .burner-action,.cafe-hotspot{
 background:repeating-linear-gradient(0deg,#374a53 0 10px,#40545a 10px 13px);
 border:3px solid #243b45;border-bottom:5px solid #182e3a;
 border-radius:12px;color:#fff9e7;
 box-shadow:inset 0 2px 9px #0a232eaa,0 2px 0 #ffffff88;
}
.grill-console .burner-action.has-food{background:#475c58}

function areaById(id){return AREAS.find(a=>a.id===id)||AREAS[0]}
function areaIndex(id){return AREAS.findIndex(a=>a.id===id)}
function burgerAvailable(r,id){return r.at<=areaById(id).burger}
function cafeAvailable(r,id){return r.at<=areaById(id).cafe}
function areaForRecipe(r,kind='burger'){return AREAS.find(a=>r.at<=(kind==='burger'?a.burger:a.cafe))||AREAS[AREAS.length-1]}
function availableBurger(id){return RECIPES.filter(r=>burgerAvailable(r,id))}
function availableCafe(kind,id){return CAFE_RECIPES[kind].filter(r=>cafeAvailable(r,id))}
function allAreaMenus(id){return availableBurger(id).length+CAFE_IDS.reduce((n,k)=>n+availableCafe(k,id).length,0)}
function legacyOrderIngredient(id){
 if(!ING[id]||!s.order||!s.seq.length&&!s.grill.some(Boolean))return false;
 const r=recipe();if(burgerAvailable(r,s.travel.current))return false;
 return r.seq.includes(id)||orderMods().some(m=>m.type==='add'&&m.id===id);
}
function isCookAllowed(id){return !!ING[id]&&(ING[id].at<=areaById(s.travel.current).burger||legacyOrderIngredient(id))}
function allCafeIngredients(kind,areaId){
 const all=availableCafe(kind,areaId);
 const ids=new Set(all.flatMap(r=>r.seq));
 ids.add(CAFE_KINDS[kind].raw);ids.add(CAFE_KINDS[kind].cooked);
 if(kind==='fries'&&areaIndex(areaId)>=1)ids.add('fryketchup'); // optional custom topping from Windmill Hill
 return ids;
}

function crossoverOrderMods(kind,recipe,areaId,maxChanges){

  if(target.id===recipe.id||target.seq.length>capacity)continue;
  const newCounts=counts(target.seq),ids=new Set([...oldCounts.keys(),...newCounts.keys()]);
  const mods=[];let possible=true;
  for(const id of ids){
   const before=oldCounts.get(id)||0,after=newCounts.get(id)||0;
   if(core.has(id)&&before!==after){possible=false;break;}
   if(after<before){
    // An omission removes all copies of an ingredient, not just one.
    if(after!==0){possible=false;break;}
    mods.push({type:'remove',id,qty:0});
   }else if(after>before){
    if(after-before>3){possible=false;break;}
    mods.push({type:'add',id,qty:after-before});
   }
  }
  if(!possible||!mods.length||mods.length>maxChanges)continue;
  const kept=original.filter(id=>!mods.some(m=>m.type==='remove'&&m.id===id));
  let pos=0;for(const id of target.seq)if(id===kept[pos])pos++;

  if(!burger&&(target.seq[0]!==kept[0]||(kind==='sundae'&&target.seq[1]!==kept[1])))continue;
  matches.push(mods);

}
function orderModsFor(kind,recipe,areaId){

 // A few such crossovers are intentionally included in the natural rotation.

    const pool=removable.filter(id=>!seen.has(id));if(!pool.length)break;

     const named=(id==='cheese'&&menuName.includes('チーズ'))
       ||(id==='bacon'&&menuName.includes('ベーコン'))

function travelTo(id,confirmed=false){
 const dest=AREAS.find(a=>a.id===id);if(!dest)return;
 const idx=areaIndex(id),owned=s.travel.owned.includes(id),prior=AREAS[idx-1];
 if(!owned){
  if(prior&&!s.travel.owned.includes(prior.id)){toast('まず手前の行き先を解放しよう。');return;}
  if(s.coins<dest.cost){toast(`あと${(dest.cost-s.coins).toLocaleString('ja-JP')} G必要です。`);return;}
  if(!confirmed){ui.modal={type:'travel-buy',id};render();return;}
  s.coins-=dest.cost;s.travel.owned.push(id);
 }
 if(s.travel.current===id){save();render();return;}
 s.travel.current=id;
 // Keep active drafts and finished tray dishes. New menus appear on fresh orders.
 if(!s.seq.length&&s.grill.every(x=>!x)&&!s.pendingNext&&s.mode!=='free'){
  s.lastRecipe=s.order?.recipe||'';s.order=newOrder(s);s.serial=s.order.number;
 }
 for(const kind of CAFE_IDS){
  const d=s.cafe.drafts[kind];
  if(d&&!d.seq.length&&!d.tool){s.cafe.orders[kind]=cafeRandomOrder(kind,s.cafe.counts[kind],s.cafe.orders[kind]?.recipe||'',id);}
 }
 const old=s.setMeal;
 if(old&&!old.paid&&!Object.keys(old.tray).length&&!old.work.seq.length&&old.work.grill.every(x=>!x)&&CAFE_IDS.every(k=>!old.work.cafe.drafts[k]?.seq?.length&&!old.work.cafe.drafts[k]?.tool)){
  s.setMeal=createSetMeal(old.completed,old);
 }
 const newBadges=collectAchievementUnlocks();
 save();render();toast(`${dest.emoji} ${dest.name}で営業を始めます！${newBadges.length?' 🏅 '+newBadges.map(b=>b.name).join('・'):''}`);
}

function render(){
 const wasRecipeExpanded=!!document.querySelector('.play-screen.recipe-expanded');
 const pantryScroll=document.getElementById('ingredientScroll')?.scrollTop||0;
 const pantryScrollX=document.getElementById('ingredientScroll')?.scrollLeft||0;
 const oldPantryTab=document.querySelector('.pantry-tabs .tab.active')?.dataset.tab||'';
 const oldCafeKind=document.querySelector('.cafe-kind.active')?.dataset.cafeKind||'';
 const tabsScroll=document.querySelector('.pantry-tabs')?.scrollLeft||0;
 const pages=[['kitchen','🍔 バーガー'],['cafe','🍟 カフェ'],['set','🍽️ セット'],['shop','🗺️ おみせ'],['book','📖 レシピ'],['record','🏅 記録']];
 root.dataset.area=s.travel.current;
 root.dataset.uiPage=ui.page;
 root.innerHTML=`<header class="site-head"><div class="brand"><img class="brand-logo-image" alt="ぺこぺこダイナー" src="${PEKOPEKO_DINER_LOGO}" width="1500" height="500" decoding="async"></div>${statusHtml()}</header><nav class="navline" aria-label="メインメニュー">${pages.map(([id,n])=>`<button class="nav ${ui.page===id?'active':''}" data-page="${id}" aria-label="${n}" title="${n}"><span class="nav-full">${n}</span><span class="nav-short" aria-hidden="true">${({kitchen:'🍔調理',cafe:'🍟カフェ',set:'🍽️セット',shop:'🗺️旅',book:'📖図鑑',record:'🏅記録'})[id]}</span></button>`).join('')}</nav><main>${ui.page==='kitchen'?kitchenPage():ui.page==='cafe'?cafePage():ui.page==='set'?setPage():ui.page==='shop'?shopPage():ui.page==='book'?bookPage():recordPage()}</main><footer class="foot">ぺこぺこダイナー v0.55 ・ 全${TOTAL_MENU_COUNT}種類の基本メニュー / 時間制限なし ・ オフライン対応 ・ 自動保存</footer>${ui.modal?modalHtml():''}${ui.toast?`<div class="notice" role="status">${safe(ui.toast)}</div>`:''}`;
 const pantry=document.getElementById('ingredientScroll');
 if(pantry){
   syncIngredientShelf();
   const sameTab=oldPantryTab===(document.querySelector('.pantry-tabs .tab.active')?.dataset.tab||'');
   const sameCafeKind=oldCafeKind===(document.querySelector('.cafe-kind.active')?.dataset.cafeKind||'');
   pantry.scrollTop=pantryScroll;
   pantry.scrollLeft=sameTab&&sameCafeKind?pantryScrollX:0;
 }
 const tabs=document.querySelector('.pantry-tabs');if(tabs)tabs.scrollLeft=tabsScroll;
 if(wasRecipeExpanded&&!document.querySelector('.play-screen.recipe-expanded'))window.scrollTo({top:0,behavior:'instant'});
}

function helpHtml(){
 const topics=[['start','🍔','最初の1皿'],['order','🧾','追加・抜き'],['cafe','🍟','カフェ料理'],['set','🗺️','セット・旅']];
 const topic=topics.some(t=>t[0]===ui.helpTopic)?ui.helpTopic:'start';
 const thing=(emoji,label)=>`<div class="help-thing"><div class="help-thing-emoji">${emoji}</div><div class="help-thing-label">${label}</div></div>`;
 const arrow='<span class="help-arrow" aria-hidden="true">➜</span>';
 const card=(n,title,scene,description)=>`<section class="help-card"><h4><span class="help-num">${n}</span>${title}</h4><div class="help-scene">${scene}</div><p>${description}</p></section>`;
 let title='',subtitle='',cards='',note='';
 if(topic==='start'){
  title='最初のバーガーを作ろう！';subtitle='注文を見て、食材を運んで、完成させるだけ。';
  cards+=card('1','注文票を見る',`<div class="help-ticket"><strong>🍔 フレッシュトマトバーガー</strong><span class="help-red">− トマト抜き</span><br><span>📖 基本レシピを見る</span></div>`,'バーガー名と、下に書かれた変更希望を確認しよう。');
  cards+=card('2','パンから順番に重ねる',`${thing('🥯','下のパン')}${arrow}${thing('🥬','レタスなど')}${arrow}${thing('🍞','上のパン')}`,'「基本レシピを見る」で重ねる順番を確認。下のパンが最初、上のパンが最後！');

function score(seq,r,mods){
  if(isPerfectOrder(seq,r,mods))return 3;
  const targetCounts=requiredCounts(r,mods);let same=0;
  for(const id of seq)if(targetCounts[id]>0){same++;targetCounts[id]--;}
  const expected=Object.values(requiredCounts(r,mods)).reduce((a,b)=>a+b,0);
  const ratio=same/Math.max(seq.length,expected);
  return ratio>=.8?2:1;
}

 if(cooked){const slot=Number(cooked.dataset.grill),it=s.grill[slot];
   if(it&&it.ready)return {kind:'cooked',id:it.id,slot,node:cooked};
 }
 const ingredient=target.closest('[data-ingredient]');
 if(ingredient&&!ingredient.disabled&&ING[ingredient.dataset.ingredient])
   return {kind:'raw',id:ingredient.dataset.ingredient,slot:null,node:ingredient};
 return null;
}
function dropAt(x,y){
 const target=document.elementFromPoint(x,y)?.closest('#plateDrop,#grillDrop');
 if(!target)return null;
 const zone=target.id;
 const specific=target.closest('.burner-action[data-grill]');
 return {zone,slot:specific?Number(specific.dataset.grill):null};
}
function validDrop(d,drop){
 if(!drop)return false;
 if(d.kind==='cooked')return drop.zone==='plateDrop'&&s.seq.length<11;
 if(ING[d.id].cat==='hot'){
   if(drop.zone!=='grillDrop')return false;
   return drop.slot===null?s.grill.some(x=>!x):!s.grill[drop.slot];
 }
 return drop.zone==='plateDrop'&&s.seq.length<11;
}
function clearDragVisuals(){
 document.querySelectorAll('.drag-valid,.drag-invalid,.drag-origin').forEach(el=>el.classList.remove('drag-valid','drag-invalid','drag-origin'));
 if(drag?.ghost)drag.ghost.remove();
}
function cancelDrag(){clearDragVisuals();drag=null;if(grillRefreshPending)refreshGrillDom();}
root.addEventListener('pointerdown',e=>{
 if(ui.modal||e.button!==0||!e.isPrimary)return;
 const src=sourceAt(e.target);if(!src)return;
 cancelDrag();
 drag={...src,x:e.clientX,y:e.clientY,pointerId:e.pointerId,started:false,ghost:null};
}, {passive:true});
document.addEventListener('dragstart',e=>{
 if(e.target.closest('[data-ingredient],.burner-action'))e.preventDefault();
});
document.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.pointerId)return;
 const d=drag;
 if(!d.started){
   if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<9)return;
   d.started=true;
   const ghost=document.createElement('div');ghost.className='drag-ghost ingredient-ghost';
   ghost.innerHTML=`<span class="ghost-emoji">${ingredientIcon(d.id)}</span><span class="ghost-label">${ING[d.id].n}</span>`;
   document.body.appendChild(ghost);d.ghost=ghost;
   d.node?.classList.add('drag-origin');
 }
 e.preventDefault();
 d.ghost.style.left=e.clientX+'px';d.ghost.style.top=(e.clientY-18)+'px';
 const drop=dropAt(e.clientX,e.clientY);
 document.querySelectorAll('.drag-valid,.drag-invalid').forEach(el=>el.classList.remove('drag-valid','drag-invalid'));
 if(drop){const zone=document.getElementById(drop.zone);if(zone)zone.classList.add(validDrop(d,drop)?'drag-valid':'drag-invalid');}
}, {passive:false});
document.addEventListener('pointerup',e=>{
 if(!drag||e.pointerId!==drag.pointerId)return;
 const d=drag,wasDragging=d.started;
 const drop=wasDragging?dropAt(e.clientX,e.clientY):null;
 const accepted=wasDragging&&validDrop(d,drop);
 cancelDrag();
 if(!wasDragging)return; // a short tap is handled by the regular click listener
 ignoreClickUntil=Date.now()+90;
 if(!accepted){
   if(!drop)toast('お皿か焼き台まで、食材を運んでね。');
   else if(d.kind==='cooked')toast('焼き上がった材料は、お皿に運んでね。');
   else if(ING[d.id].cat==='hot'&&drop.zone==='plateDrop')toast('焼きものは、先に焼き台で焼こう。');
   else if(ING[d.id].cat!=='hot'&&drop.zone==='grillDrop')toast(isSauce(d.id)?'ソースはコンロではなく、お皿のバーガーにかけよう。':'この食材は、お皿に直接のせよう。');
   else toast('空いている場所に運んでね。');
   return;
 }
 if(d.kind==='cooked'){
   s.seq.push(d.id);noteBurgerPlacement(d.id,s.seq.length-1);s.grill[d.slot]=null;save();render();
 }else addIngredient(d.id,drop.zone,drop.slot);
});
document.addEventListener('pointercancel',cancelDrag);
window.addEventListener('blur',cancelDrag);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){const wasResult=ui.modal.type==='result',wasCafe=ui.modal.type==='cafe-result';ui.modal=null;if(wasResult)changeOrder();else if(wasCafe)cafeNext();else render();}});
let cafeDrag=null;
function cafeSource(target){
 if((ui.page!=='cafe'&&!(ui.page==='set'&&s.setMeal?.active!=='burger'))||ui.modal)return null;
 const cooked=target.closest('[data-cafe-tool]');
 if(cooked&&cafeDraft().tool?.phase==='ready')return{type:'cooked',id:cafeKind()==='sundae'?cafeDraft().tool.id:CAFE_KINDS[cafeKind()].cooked,node:cooked};
 const button=target.closest('[data-cafe-ingredient]');
 if(button)return{type:'raw',id:button.dataset.cafeIngredient,node:button};
 return null;
}
function cafeDrop(x,y){return document.elementFromPoint(x,y)?.closest('#cafePlateDrop,#cafeCookDrop')?.id||null}
function cafeDropValid(d,zone){if(d.type==='cooked')return zone==='cafePlateDrop'&&cafeDraft().seq.length<12&&(cafeKind()!=='sundae'||(cafeDraft().seq[0]==='glass'&&!cafeDraft().seq.some(id=>SUNDAE_SOFT.includes(id))));return cafeCanPlace(d.id,cafeKind(),zone)}
function clearCafeDrag(){if(cafeDrag?.ghost)cafeDrag.ghost.remove();document.querySelectorAll('.cafe-glow,.cafe-drag-origin').forEach(n=>n.classList.remove('cafe-glow','cafe-drag-origin'));cafeDrag=null;}
root.addEventListener('pointerdown',e=>{if(e.button!==0||!e.isPrimary)return;const src=cafeSource(e.target);if(!src)return;clearCafeDrag();cafeDrag={...src,idPointer:e.pointerId,x:e.clientX,y:e.clientY,moved:false,ghost:null}}, {passive:true});
document.addEventListener('pointermove',e=>{
 if(!cafeDrag||e.pointerId!==cafeDrag.idPointer)return;
 const d=cafeDrag;if(!d.moved){if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<9)return;d.moved=true;
  d.ghost=document.createElement('div');d.ghost.className='drag-ghost ingredient-ghost';
  d.ghost.innerHTML=`<span class="ghost-emoji">${cafeIngredientIcon(d.id)}</span><span class="ghost-label">${CAFE_ING[d.id].name}</span>`;document.body.appendChild(d.ghost);d.node.classList.add('cafe-drag-origin');
 }
 e.preventDefault();d.ghost.style.left=e.clientX+'px';d.ghost.style.top=(e.clientY-15)+'px';
 document.querySelectorAll('.cafe-glow').forEach(n=>n.classList.remove('cafe-glow'));
 const zone=cafeDrop(e.clientX,e.clientY);if(zone&&cafeDropValid(d,zone))document.getElementById(zone)?.classList.add('cafe-glow');
},{passive:false});
document.addEventListener('pointerup',e=>{
 if(!cafeDrag||e.pointerId!==cafeDrag.idPointer)return;
 const d=cafeDrag,zone=d.moved?cafeDrop(e.clientX,e.clientY):null,valid=d.moved&&cafeDropValid(d,zone);
 clearCafeDrag();if(!d.moved)return;
 ignoreClickUntil=Date.now()+130;
 if(!valid){toast('材料に合う調理台へ運んでね。');return}
 if(d.type==='cooked')cafePickup();else cafePlace(d.id,zone);
});
document.addEventListener('pointercancel',clearCafeDrag);
window.addEventListener('blur',clearCafeDrag);

// Drag an assembled dish onto the corresponding serving-tray cell.
let setFoodDrag=null;
root.addEventListener('pointerdown',e=>{
 if(!isSetActive()||ui.page!=='set'||ui.modal||!e.isPrimary||e.button!==0||s.setMeal?.tray?.[s.setMeal.active])return;
 const el=e.target.closest('[data-set-food-source]');if(!el)return;
 const slot=s.setMeal.active,kind=setLineKind(slot),seq=kind==='burger'?s.seq:s.cafe.drafts[kind]?.seq;
 if(!seq?.length)return;
 setFoodDrag={pointer:e.pointerId,x:e.clientX,y:e.clientY,started:false,ghost:null,slot};
},{passive:true});
document.addEventListener('pointermove',e=>{
 const d=setFoodDrag;if(!d||d.pointer!==e.pointerId)return;
 if(!d.started){if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<9)return;d.started=true;
  const ghost=document.createElement('div');ghost.className='set-food-ghost';ghost.textContent=SET_EMOJI[setLineKind(d.slot)];document.body.appendChild(ghost);d.ghost=ghost;}
 e.preventDefault();d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px';
 document.querySelectorAll('.set-tray-cell').forEach(el=>el.classList.remove('drop-ready'));
 const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-set-tray-target]');
 if(target?.dataset.setTrayTarget===d.slot)target.classList.add('drop-ready');
},{passive:false});
function clearSetFoodDrag(){if(setFoodDrag?.ghost)setFoodDrag.ghost.remove();document.querySelectorAll('.set-tray-cell').forEach(el=>el.classList.remove('drop-ready'));setFoodDrag=null;}
document.addEventListener('pointerup',e=>{
 const d=setFoodDrag;if(!d||d.pointer!==e.pointerId)return;
 const target=d.started?document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-set-tray-target]'):null;
 const valid=d.started&&target?.dataset.setTrayTarget===d.slot;
 clearSetFoodDrag();if(!d.started)return;
 ignoreClickUntil=Date.now()+160;
 if(valid)setTrayPut();else toast('できた料理は同じマークのトレーに運んでね。');
});
document.addEventListener('pointercancel',clearSetFoodDrag);
window.addEventListener('blur',clearSetFoodDrag);


/* v0.55: choose 1 or 2 horizontal rows using the REAL free shelf height,
   instead of guessing based on the device height. Recipes remain normal scroll pages. */
function syncIngredientShelf(){
 const pane=document.getElementById('ingredientScroll');
 if(!pane)return;
 const mobile=window.matchMedia('(max-width:760px)').matches;
 const normal=!document.querySelector('.play-screen.recipe-expanded');
 if(!mobile||!normal){delete pane.dataset.shelfRows;return;}
 const rows=pane.clientHeight>=135?2:1;
 pane.dataset.shelfRows=String(rows);
}
window.addEventListener('resize',syncIngredientShelf);

advanceGrillTimers();cafeAdvance();
save();render();
window.setInterval(()=>{advanceGrillTimers();cafeAdvance()},120);
})();
</script>
</body></html>
